### Selection-ARM LoRA trained on GPT-6 labels of OUR SFT policy's candidates.
### Same recipe as arm_lora.yaml; only the base, data and output paths differ.
### Base = the policy whose candidates were labelled (the repo's convention: judge = LoRA on the actor's SFT).
### freeze_multi_modal_projector: true is the published ARM recipe (LoRA judge), not a policy-SFT setting.
### image_max_pixels must stay equal to serve_arm.py --max-pixels (default 262144).

### model
model_name_or_path: /mmfs1/gscratch/krishna/dan29/OpenWebRL/outputs/sft/llamafactory/checkpoints/qwen3-vl-4b-thinking-openwebrl-sft-repro-unfrozen-projector
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset (output of data_generation/openwebrl_actor/build_selection_sft_gpt6.py)
dataset_dir: /mmfs1/gscratch/krishna/dan29/arm_gpt6/selection_sft
media_dir: /mmfs1/gscratch/krishna/dan29/arm_gpt6/selection_sft
dataset: owrl_gpt6_selection
template: qwen3_vl
cutoff_len: 8192
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /mmfs1/gscratch/krishna/dan29/arm_gpt6/ckpts/arm_lora_gpt6
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: owrl-arm-selection-lora-gpt6

### train
num_train_epochs: 2.0
learning_rate: 1.0e-4
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
